# 未読菩薩 (Midoku Bosatsu) - 掲示板設定
config_version = 2

# -----------------------------------------------------------------------------
# あやしいわーるど＠みさお
# -----------------------------------------------------------------------------
[[sites]]
id = "misao"
name = "あやしいわーるど＠みさお"
enabled = true
encoding = "shift_jis"
user_agent = "Midoku Bosatsu"
max_posts = 666
timezone_offset_minutes = 540
timezone_region = "日本"
[sites.badge_style]
text_color = "#eefafa"
background_color = "#0b5555"
border_color = "#2f6262"

[sites.fetch]
url = "https://misao.mixh.jp/cgi-bin/bbs.cgi"

[sites.post_parser]
mode = "legacy_anchor_siblings"
anchor_selector = "a[name]"
id_attribute = "name"
header_tag = "font"
name_tag = "b"
info_tag = "font"
body_container_tag = "blockquote"
body_tag = "pre"
date_prefix = "投稿日："
timestamp_regex = '(?P<year>\d{4})/(?P<month>\d{2})/(?P<day>\d{2})\([^)]+\)\s*(?P<hour>\d{2})(?:時|:)(?P<minute>\d{2})(?:分|:)(?P<second>\d{2})(?:秒)?'

[sites.reload_form]
form_selector = "form"
submit_input_name = "midokureload"
submit_input_name_fallbacks = ["meload", "readnew"]
submit_value_regex = "未読"
method = "POST"
referer = "https://misao.mixh.jp/cgi-bin/bbs.cgi"
include_hidden = true

