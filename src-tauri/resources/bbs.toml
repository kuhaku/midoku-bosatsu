# -----------------------------------------------------------------------------
# あやしいわーるど＠おこめ.暫暫定
# -----------------------------------------------------------------------------
[[sites]]
id = "okome-znti"
name = "あやしいわーるど＠おこめ.暫暫定"
enabled = true
encoding = "utf-8"
user_agent = "Midoku Bosatsu"
max_posts = 666
timezone_offset_minutes = 540
timezone_region = "日本"
[sites.badge_style]
text_color = "#eefafa"
background_color = "#202124"
border_color = "#2f6262"

[sites.fetch]
url = "https://komekuitai.sakura.ne.jp/znti/bbs.php"

[sites.post_parser]
mode = "css_post"
post_selector = "div.m"
post_id_attribute = "id"
post_id_prefix = "m"
title_selector = ".ms"
name_selector = ".mun"
date_selector = ".md"
body_selector = "pre.msgnormal"
date_prefix = "投稿日："
timestamp_regex = '(?P<year>\d{4})/(?P<month>\d{2})/(?P<day>\d{2})\([^)]+\)\s*(?P<hour>\d{2})(?:時|:)(?P<minute>\d{2})(?:分|:)(?P<second>\d{2})(?:秒)?'

[sites.reload_form]
form_selector = "form"
submit_input_name = "readnew"
submit_input_name_fallbacks = ["meload", "midokureload"]
submit_value_regex = "未読|Unread|UNREAD"
method = "POST"
referer = "https://komekuitai.sakura.ne.jp/znti/bbs.php"
include_hidden = true
