[package]
name = "midoku-bosatsu"
version = "1.0.2"
description = "Midoku Bosatsu: a cross-platform reader for Strange-World BBSs."
authors = ["Kuhaku"]
edition = "2021"

[lib]
name = "midoku_bosatsu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
toml = "1.1"
kuchikiki = "0.8.9-speedreader"
encoding_rs = "0.8"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
tokio = { version = "1", features = ["time"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.1"
tauri-plugin-window-state = "2.4.1"
