[package]
name = "midoku-bosatsu"
version = "0.1.4"
description = "Midoku Bosatsu: a cross-platform reader for Strange World BBS."
authors = ["Midoku Bosatsu"]
edition = "2021"

[lib]
name = "midoku_bosatsu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.1", features = [] }
tauri-plugin-opener = "2.5.0"
tauri-plugin-dialog = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
kuchikiki = "0.8.2"
encoding_rs = "0.8"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
