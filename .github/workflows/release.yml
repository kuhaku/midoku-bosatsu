name: Release

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml versions
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs

  prepare-release:
    name: Create draft release
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "midoku-bosatsu v$version"

  build-and-release:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            artifact: windows-x64
            platform: windows-latest
            portable: true
          - name: macOS Apple Silicon
            artifact: macos-aarch64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            artifact: macos-x86_64
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Linux x64
            artifact: linux-x86_64
            platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && matrix.target || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure ad-hoc signing on macOS
        if: startsWith(matrix.platform, 'macos-')
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Build portable Windows binary
        if: matrix.portable
        run: npm run tauri -- build --no-bundle

      - name: Create portable Windows ZIP
        if: matrix.portable
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^app-v', ''
          $archiveName = "midoku-bosatsu_${version}_windows-x64.zip"
          $packageRoot = Join-Path $env:RUNNER_TEMP 'midoku-bosatsu'
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          Copy-Item src-tauri/target/release/midoku-bosatsu.exe $packageRoot
          Copy-Item src-tauri/resources $packageRoot/resources -Recurse
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $archiveName
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Move-Item $archiveName release-assets/$archiveName

      - name: Build release assets
        if: ${{ !matrix.portable }}
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release-assets/**
            src-tauri/target/**/bundle/**

  publish-release:
    name: Publish completed release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-assets-*
          path: release-assets

      - name: Generate unified updater manifest
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node scripts/generate-updater-manifest.mjs release-assets release-assets-to-upload

      - name: Upload release assets and publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          find release-assets-to-upload -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
