name: Release

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml versions
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs

  prepare-release:
    name: Create draft release
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "midoku-bosatsu v$version"

  build-and-release:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            portable: true
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && matrix.target || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure ad-hoc signing on macOS
        if: startsWith(matrix.platform, 'macos-')
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Build portable Windows binary
        if: matrix.portable
        run: npm run tauri -- build --no-bundle

      - name: Create portable Windows ZIP
        if: matrix.portable
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^app-v', ''
          $archiveName = "midoku-bosatsu_${version}_windows-x64.zip"
          $packageRoot = Join-Path $env:RUNNER_TEMP 'midoku-bosatsu'
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          Copy-Item src-tauri/target/release/midoku-bosatsu.exe $packageRoot
          Copy-Item src-tauri/resources $packageRoot/resources -Recurse
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $archiveName
          "WINDOWS_RELEASE_ASSET=$archiveName" >> $env:GITHUB_ENV

      - name: Upload portable Windows ZIP
        if: matrix.portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: gh release upload "$env:GITHUB_REF_NAME" $env:WINDOWS_RELEASE_ASSET --clobber

      - name: Build and upload release assets
        if: ${{ !matrix.portable }}
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'midoku-bosatsu v__VERSION__'
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][ext]"
          args: ${{ matrix.args }}

  publish-release:
    name: Publish completed release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish draft release after every matrix build succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
